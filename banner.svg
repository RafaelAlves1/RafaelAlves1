<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame">
      <rect width="900" height="220" rx="12"/>
    </clipPath>

    <clipPath id="typeClip1">
      <rect x="60" y="168" height="18">
        <animate attributeName="width"
          keyTimes="0;0.1667;0.3333;0.4222;0.4556;0.6222;0.7889;0.8778;1"
          values="0;340;340;0;0;0;0;0;0"
          dur="10s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="typeClip2">
      <rect x="60" y="168" height="18">
        <animate attributeName="width"
          keyTimes="0;0.1667;0.3333;0.4222;0.4556;0.6222;0.7889;0.8778;1"
          values="0;0;0;0;0;360;360;0;0"
          dur="10s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="220" fill="#0d1117"/>

    <!-- Background -->
    <g fill="#161b22">
      <rect x="560" y="20" width="46" height="46"/>
      <rect x="610" y="20" width="46" height="46"/>
      <rect x="660" y="20" width="46" height="46"/>
      <rect x="710" y="20" width="46" height="46"/>
      <rect x="760" y="20" width="46" height="46"/>
      <rect x="810" y="20" width="46" height="46"/>

      <rect x="560" y="70" width="46" height="46"/>
      <rect x="610" y="70" width="46" height="46"/>
      <rect x="660" y="70" width="46" height="46"/>
      <rect x="710" y="70" width="46" height="46"/>
      <rect x="760" y="70" width="46" height="46"/>
      <rect x="810" y="70" width="46" height="46"/>

      <rect x="560" y="120" width="46" height="46"/>
      <rect x="610" y="120" width="46" height="46"/>
      <rect x="660" y="120" width="46" height="46"/>
      <rect x="710" y="120" width="46" height="46"/>
      <rect x="760" y="120" width="46" height="46"/>
      <rect x="810" y="120" width="46" height="46"/>

      <rect x="560" y="170" width="46" height="46"/>
      <rect x="610" y="170" width="46" height="46"/>
      <rect x="660" y="170" width="46" height="46"/>
      <rect x="710" y="170" width="46" height="46"/>
      <rect x="760" y="170" width="46" height="46"/>
      <rect x="810" y="170" width="46" height="46"/>
    </g>

    <!-- Animated Tiles -->
    <g fill="#58A6FF">
      <rect x="610" y="20" width="46" height="46" opacity="0.08">
        <animate attributeName="opacity" values="0.03;0.35;0.03" dur="4s" repeatCount="indefinite"/>
      </rect>

      <rect x="760" y="70" width="46" height="46" opacity="0.08">
        <animate attributeName="opacity" values="0.03;0.35;0.03" dur="5s" begin="1s" repeatCount="indefinite"/>
      </rect>

      <rect x="660" y="120" width="46" height="46" opacity="0.08">
        <animate attributeName="opacity" values="0.03;0.35;0.03" dur="4.5s" begin="2s" repeatCount="indefinite"/>
      </rect>

      <rect x="810" y="170" width="46" height="46" opacity="0.08">
        <animate attributeName="opacity" values="0.03;0.35;0.03" dur="5.2s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Name -->
    <text
      x="60"
      y="90"
      font-family="Segoe UI, Helvetica, Arial, sans-serif"
      font-size="36"
      font-weight="700"
      fill="#E6EDF3">
      Rafael Alves
    </text>

    <!-- Title -->
    <text
      x="60"
      y="122"
      font-family="Segoe UI, Helvetica, Arial, sans-serif"
      font-size="17">

      <tspan fill="#8B949E">Desenvolvedor </tspan>
      <tspan fill="#58A6FF" font-weight="700">Full Stack</tspan>

    </text>

    <!-- Stack -->
    <text
      x="60"
      y="145"
      font-family="Segoe UI, Helvetica, Arial, sans-serif"
      font-size="13"
      fill="#8B949E">

      React • Angular • ASP.NET • .NET • C# • SQL Server

    </text>

    <rect
      x="60"
      y="154"
      width="320"
      height="2"
      fill="#58A6FF"
      opacity="0.6"/>

    <!-- Typing -->
    <text
      x="60"
      y="182"
      font-family="Consolas, monospace"
      font-size="14"
      fill="#58A6FF"
      clip-path="url(#typeClip1)">
      $ backend, APIs e arquitetura
    </text>

    <text
      x="60"
      y="182"
      font-family="Consolas, monospace"
      font-size="14"
      fill="#58A6FF"
      clip-path="url(#typeClip2)">
      $ código limpo, performance e evolução
    </text>

    <!-- Cursor -->
    <rect
      y="169"
      width="9"
      height="16"
      fill="#58A6FF">

      <animate
        attributeName="x"
        keyTimes="0;0.1667;0.3333;0.4222;0.4556;0.6222;0.7889;0.8778;1"
        values="60;400;400;60;60;430;430;60;60"
        dur="10s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="1;1;0;0"
        keyTimes="0;0.5;0.51;1"
        dur="1s"
        repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
